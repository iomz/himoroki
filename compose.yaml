services:
  app:
    build: .
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      PORT: 3000
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      S3_ENDPOINT: http://alarik:8080
      S3_BUCKET: kannabi-photos
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
      APP_URL: ${APP_URL:?Set APP_URL to the browser-facing origin}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set a random BETTER_AUTH_SECRET in .env}
      KANNABI_DATA_DIR: /var/lib/kannabi
      KANNABI_SECRET_KEY: ${KANNABI_SECRET_KEY:-}
    volumes:
      - kannabi-data:/var/lib/kannabi
    depends_on:
      alarik:
        condition: service_healthy
      neo4j:
        condition: service_healthy
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
    ports:
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s

  alarik:
    image: ghcr.io/achtungsoftware/alarik:1.0.0-beta-16
    environment:
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ${ALARIK_ADMIN_PASSWORD:?Set ALARIK_ADMIN_PASSWORD}
      JWT: ${ALARIK_JWT_SECRET:?Set ALARIK_JWT_SECRET}
      DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      DEFAULT_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
      DEFAULT_BUCKETS: kannabi-photos
      ALLOW_ACCOUNT_CREATION: 'false'
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - alarik-data:/app/Storage
    healthcheck:
      test: ["CMD-SHELL", "curl -sS http://localhost:8080/ >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  alarik-data:
  kannabi-data:
  neo4j-data:
